function at(e){let r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function pair(){let a=[...pointers.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,at(e));moving=0};stage.onpointermove=e=>{let prev=pointers.get(e.pointerId);if(!prev)return;let before=pointers.size===2?pair():null,cur=at(e);pointers.set(e.pointerId,cur);if(pointers.size===1){yaw+=(cur.x-prev.x)*.008;pitch=Math.max(-1.15,Math.min(1.15,pitch+(cur.y-prev.y)*.008));moving+=Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y)}else if(before){let after=pair();if(before.d>4)zoomAt(after.d/before.d,before.x,before.y);ox+=after.x-before.x;oy+=after.y-before.y;moving=100}};stage.onpointerup=e=>{if(pointers.size===1&&moving<12){let p=at(e),hit=[...hits].reverse().find(h=>Math.hypot(h.x-p.x,h.y-p.y)<h.r+11);if(hit)select(hit.id)}pointers.delete(e.pointerId);moving=0};stage.onpointercancel=e=>pointers.delete(e.pointerId);
