<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.85, 0 0 0 0 0.78, 0 0 0 0 0.45, 0 0 0 0.15 0"></feColorMatrix>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#1C1610"></rect>
  <rect width="1200" height="800" filter="url(#noise)" opacity="0.6"></rect>
</svg>