<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="broadcastGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A140C;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#0A0A0B;stop-opacity:1"></stop>
    </linearGradient>
    <pattern id="scanlines" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="rgba(212,164,55,0.03)"></rect>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#broadcastGrad)"></rect>
  <rect width="1200" height="800" fill="url(#scanlines)"></rect>
</svg>